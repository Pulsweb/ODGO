name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ODGO focuses on centralized, long-term analysis of **on-premises data gateway** logs in Microsoft Fabric.
        VNet data gateways and near-real-time operational monitoring are out of scope (see the README).
        Don't include real identifiers or log content in your request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to achieve, and why is it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could ODGO address it? Mention the components involved (agent, setup notebook, processing, model, reports).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to contribute this change (see CONTRIBUTING.md).
